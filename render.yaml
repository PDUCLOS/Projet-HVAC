# =============================================================================
# HVAC Market Analysis — Render.com Configuration
# =============================================================================
# Automatic deployment from GitHub.
# Render detects this file and offers the configuration.
#
# Deployed services:
#   - FastAPI API (web service) — REST endpoints + Swagger UI
#   - Streamlit Dashboard (web service) — Interactive visualization
# =============================================================================

services:
  # --- FastAPI API ---
  - type: web
    name: hvac-api
    runtime: python
    repo: https://github.com/PDUCLOS/Projet-HVAC.git
    branch: main
    buildCommand: |
      pip install --upgrade pip &&
      pip install -r requirements.txt -r requirements-api.txt &&
      python scripts/generate_demo_data.py
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_TYPE
        value: sqlite
      - key: DB_PATH
        value: data/hvac_market.db
      - key: PYTHON_VERSION
        value: "3.11"
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /health
    autoDeploy: true
    plan: free

  # --- Streamlit Dashboard ---
  - type: web
    name: hvac-dashboard
    runtime: python
    repo: https://github.com/PDUCLOS/Projet-HVAC.git
    branch: main
    buildCommand: |
      pip install --upgrade pip &&
      pip install -r requirements.txt &&
      python scripts/generate_demo_data.py
    startCommand: streamlit run app/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: DB_TYPE
        value: sqlite
      - key: DB_PATH
        value: data/hvac_market.db
      - key: PYTHON_VERSION
        value: "3.11"
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /
    autoDeploy: true
    plan: free
